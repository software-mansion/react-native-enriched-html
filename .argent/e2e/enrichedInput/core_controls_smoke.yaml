# Port of .maestro/enrichedInput/flows/core_controls_smoke.yaml
steps:
  - echo: Open the EnrichedTextInput test screen
  - launch: swmansion.enriched.example
  - tap: { id: toggle-screen-button }
  - await: { visible: { id: editor-input } }
  - await: { idle: true }

  - echo: Editor controls are on screen
  - assert: { visible: { id: focus-button } }
  - assert: { visible: { id: blur-button } }
  - assert: { visible: { id: set-value-button } }

  # The toolbar is a horizontal ScrollView, so the buttons past the right edge
  # are not visible. `exists` checks that they are rendered, which is what the
  # Maestro assertVisible checked in practice.
  - echo: Every toolbar button is rendered
  - assert: { exists: { id: toolbar-bold } }
  - assert: { exists: { id: toolbar-italic } }
  - assert: { exists: { id: toolbar-underline } }
  - assert: { exists: { id: toolbar-strikethrough } }
  - assert: { exists: { id: toolbar-inline-code } }
  - assert: { exists: { id: toolbar-heading-1 } }
  - assert: { exists: { id: toolbar-heading-2 } }
  - assert: { exists: { id: toolbar-heading-3 } }
  - assert: { exists: { id: toolbar-heading-4 } }
  - assert: { exists: { id: toolbar-heading-5 } }
  - assert: { exists: { id: toolbar-heading-6 } }
  - assert: { exists: { id: toolbar-quote } }
  - assert: { exists: { id: toolbar-code-block } }
  - assert: { exists: { id: toolbar-image } }
  - assert: { exists: { id: toolbar-link } }
  - assert: { exists: { id: toolbar-mention } }
  - assert: { exists: { id: toolbar-unordered-list } }
  - assert: { exists: { id: toolbar-ordered-list } }
  - assert: { exists: { id: toolbar-checkbox-list } }
