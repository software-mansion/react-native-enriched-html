appId: swmansion.enriched.example
---
- tapOn:
    id: 'blur-button'

- waitForAnimationToEnd

# Force a delay to ensure the selection cursor is invisible
- extendedWaitUntil:
    visible: 'fake_element_to_force_delay'
    optional: true
    timeout: 1000

- runFlow:
    file: '../../subflows/capture_or_assert_screenshot.yaml'
    env:
      ELEMENT_ID: 'full-screen'
      SCREENSHOT_PREFIX: 'enrichedInput'
