appId: swmansion.enriched.example
---
- launchApp

- tapOn:
    id: "toggle-screen-button"

- runFlow:
    file: "../subflows/set_editor_value.yaml"
    env:
      VALUE: "<html><p>Line 1</p><p>Line 2</p><p>Line 3</p><p>Line 4</p><p>Line 5</p><p>Line 6</p><p>Line 7</p><p>Line 8</p><p>Line 9</p><p>Line 10</p><p>Line 11</p><p>Line 12</p><p>Line 13</p><p>Line 14</p><p>Line 15</p></html>"

- assertVisible:
    id: "scroll-offset-output"
    text: "Scroll offset: 0.00"

- swipe:
    from:
      id: "editor-input"
    direction: UP

- waitForAnimationToEnd

- assertNotVisible:
    id: "scroll-offset-output"
    text: "Scroll offset: 0.00"
