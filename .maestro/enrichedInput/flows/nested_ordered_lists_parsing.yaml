appId: swmansion.enriched.example
---
# Validates parsing and numbering of nested ordered lists
- launchApp

- tapOn:
    id: "toggle-screen-button"

- runFlow:
    file: "../subflows/set_editor_value.yaml"
    env:
        VALUE: >
            <html>
                <ol>
                    <li>A<ol>
                        <li>B</li>
                        <li>B<ol>
                            <li>C</li>
                        </ol>
                        </li>
                        <li>B</li>
                    </ol>
                    </li>
                    <li>A</li>
                </ol>
            </html>

- tapOn:
    id: "size-max-button"

- runFlow:
    file: "../subflows/capture_or_assert_screenshot.yaml"
    env:
        SCREENSHOT_NAME: "nested_ordered_lists_parsing"
