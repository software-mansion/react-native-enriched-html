appId: swmansion.enriched.example
---
- launchApp

- tapOn:
    id: "toggle-screen-button"

- runFlow:
    file: "../subflows/set_editor_value.yaml"
    env:
      VALUE: "<html><p>1</p><p>2</p><p>3</p><p>4</p><p>5</p><p>6</p><p>7</p><p>8</p><p>9</p><p>10</p><p>11</p><p>12</p><p>13</p><p>14</p><p>15</p><p>16</p><p>17</p><p>18</p><p>19</p><p>20</p><p>21</p><p>22</p><p>23</p><p>24</p><p>25</p><p>26</p><p>27</p><p>28</p><p>29</p><p>30</p><p>31</p><p>32</p><p>33</p><p>34</p><p>35</p><p>36</p><p>37</p><p>38</p><p>39</p><p>40</p></html>"

- assertVisible:
    id: "scroll-offset-output"
    text: "Scroll offset: 0.00"

- swipe:
    from:
      id: "editor-input"
    direction: UP
    duration: 1000
- waitForAnimationToEnd
- copyTextFrom:
    id: "scroll-offset-output"
- evalScript: "${output.afterFirstScroll = parseFloat(maestro.copiedText.match(/[0-9.]+/)[0])}"
- assertTrue: "${output.afterFirstScroll > 0}"

- swipe:
    from:
      id: "editor-input"
    direction: UP
    duration: 1000
- waitForAnimationToEnd
- copyTextFrom:
    id: "scroll-offset-output"
- evalScript: "${output.afterSecondScroll = parseFloat(maestro.copiedText.match(/[0-9.]+/)[0])}"
- assertTrue: "${output.afterSecondScroll > output.afterFirstScroll}"

- swipe:
    from:
      id: "editor-input"
    direction: DOWN
    duration: 1000
- waitForAnimationToEnd
- copyTextFrom:
    id: "scroll-offset-output"
- evalScript: "${output.afterScrollUp = parseFloat(maestro.copiedText.match(/[0-9.]+/)[0])}"
- assertTrue: "${output.afterScrollUp < output.afterSecondScroll}"
