appId: swmansion.enriched.example
tags:
    - ios-only
---
# PR #820 - fix(iOS): keep checkbox states after inline images
- launchApp

- tapOn:
    id: 'toggle-screen-button'

- runFlow:
    file: '../subflows/set_editor_value.yaml'
    env:
      VALUE: >
        <html>
          <p><img src="placeholder" width="80" height="80"/></p>
          <ul data-type="checkbox">
            <li checked>B</li>
          </ul>
        </html>

- runFlow:
    file: '../subflows/capture_or_assert_screenshot.yaml'
    env:
      SCREENSHOT_NAME: 'checkbox_after_images'
