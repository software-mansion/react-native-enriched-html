appId: swmansion.enriched.example
---
# Validates parsing of nested unordered > ordered > checkbox lists
- launchApp

- tapOn:
    id: "toggle-screen-button"

- runFlow:
    file: "../subflows/set_editor_value.yaml"
    env:
        VALUE: >
            <html>
                <ul>
                    <li>1</li>
                    <li>2<ol>
                        <li>3</li>
                        <li>4<ul data-type="checkbox">
                            <li checked>5</li>
                            <li>6</li>
                        </ul>
                        </li>
                    </ol>
                    </li>
                </ul>
            </html>

- tapOn:
    id: "size-max-button"

- runFlow:
    file: "../subflows/capture_or_assert_screenshot.yaml"
    env:
        SCREENSHOT_NAME: "nested_lists_mixed_parsing"
