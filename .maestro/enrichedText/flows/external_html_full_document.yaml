appId: swmansion.enriched.example
---
# fix(iOS): external HTML with a <body> skipped the normalizer
- launchApp

- tapOn:
    id: 'toggle-screen-button'

- tapOn:
    id: 'toggle-enriched-text-screen-button'

- runFlow:
    file: '../subflows/set_enriched_text_value.yaml'
    env:
      VALUE: '<body><p><strong>Bold</strong> <em>it</em></p></body>'

- runFlow:
    file: '../subflows/capture_or_assert_screenshot.yaml'
    env:
      SCREENSHOT_NAME: 'external_html_full_document'
